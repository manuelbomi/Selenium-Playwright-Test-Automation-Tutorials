[pytest]
# Default browser when you run plain `pytest` with no --browser flag.
# pytest-playwright bundles Chromium, Firefox, and WebKit with the package
# itself (see README "Installing pytest-playwright"), so switching browsers
# is a CLI flag, not a separate driver download like Selenium's
# webdriver-manager from earlier tutorials.
addopts = --browser chromium

# Where pytest looks for test files/functions.
testpaths = tests

# Other useful pytest-playwright CLI flags (deliberately NOT hardcoded here
# so you choose them per run):
#
#   pytest --headed
#       Runs with a real, visible browser window instead of headless mode.
#       Great for watching a test execute step by step while debugging.
#
#   pytest --tracing=retain-on-failure
#       Records a Playwright trace (DOM snapshots, network, console, a full
#       action timeline) for each test, but only KEEPS the trace.zip for
#       tests that fail. See README "Trace Viewer" section.
#
#   pytest --tracing=on
#       Always records and keeps a trace, even for passing tests. Heavier,
#       useful when you need to double-check a flaky-looking pass.
#
#   pytest --video=retain-on-failure
#       Saves a screen-recording video, kept only for failing tests.
#
#   pytest --screenshot=only-on-failure
#       Captures a PNG screenshot at the moment a test fails.
#
#   pytest --browser firefox
#   pytest --browser webkit
#       Runs the same test suite against a different browser engine with
#       zero code changes -- another benefit of Playwright's locator +
#       auto-wait model being browser-agnostic.
#
#   pytest --slowmo=250
#       Slows every action down by 250ms so a --headed run is easier to
#       follow with your own eyes while debugging.
