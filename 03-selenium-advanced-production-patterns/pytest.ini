[pytest]
# Ensures `import config` and `import pages...` resolve regardless of how
# or from where pytest is invoked (local shell, CI, a different cwd), by
# adding this tutorial's root folder to sys.path. Requires pytest >= 7.
pythonpath = .

testpaths = tests

# -ra: show a short summary of all non-passing tests (skips/xfails/etc.),
# not just failures — useful signal that's easy to miss otherwise.
addopts = -ra --strict-markers

markers =
    smoke: fast, high-value subset safe to run on every push
