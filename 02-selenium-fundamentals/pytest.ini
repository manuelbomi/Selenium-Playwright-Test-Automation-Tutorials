[pytest]
# Where pytest looks for test files — keeps discovery fast and predictable
# as the suite grows across more page objects and test modules.
testpaths = tests

# Explicit file/class/function patterns avoid accidentally collecting
# unrelated scripts (e.g. one-off debug scripts) as tests.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers used to group tests so CI can run subsets (e.g. `-m smoke`
# for a fast pre-merge check vs. the full regression suite).
markers =
    smoke: quick, high-value tests that should run on every commit
    regression: broader coverage, safe to run less frequently

# -ra: show a short summary of skips/failures/errors at the end of the run.
# --strict-markers: typos in @pytest.mark names fail the run instead of
# silently registering a new, unintended marker.
addopts = -ra --strict-markers
